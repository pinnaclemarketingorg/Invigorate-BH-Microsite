# Deploys the built pages in site/ to the Cloudways app (help.invigoratebh.com)
# on every push to main. Cloudways has no build step: run `python src/build.py`
# and commit site/ before pushing.
#
# Only the CONTENTS of site/ are uploaded, so site/lpc/index.html is served at
# /lpc/ and site/index.html at /. src/, preview/ and README.md never leave GitHub.
#
# Needs 3 repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDWAYS_HOST      - server Public IP
#   CLOUDWAYS_USER      - application username (Access Details > Application Credentials)
#   CLOUDWAYS_PASSWORD  - application password  (same place)

name: Deploy to Cloudways

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check built pages are present
        run: |
          test -f site/index.html || { echo "site/index.html missing - run python src/build.py and commit site/"; exit 1; }
          echo "Files to upload:" && find site -type f | sort

      # Removes Cloudways' placeholder index.php (it answers every unknown URL,
      # which hid the real pages) and anything an earlier version of this
      # workflow uploaded outside site/. Safe to run on every deploy.
      - name: Clean up server folder
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          port: 22
          script: |
            cd public_html || exit 1
            rm -rf index.php src preview site home .gitignore README.md
            echo "public_html now contains:"; ls -la

      - name: Upload to Cloudways (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          port: 22
          local_path: "./site/*"
          remote_path: "public_html"
          sftp_only: true
